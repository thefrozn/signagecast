# SignageCast – Antworten für den Debian-Installer (Installations-ISO, seit 0.52).
# Sprache und Tastatur kommen aus dem Startmenü (Deutsch/English). Bewusst NICHT vorgegeben – das fragt der Installer:
#   - das Passwort für den Benutzer tvadmin (Anmeldung an der Verwaltung)
#   - die Bestätigung, dass die Platte gelöscht wird (partman/confirm)
#   - WLAN-Name und -Schlüssel, falls kein Kabel steckt
# Danach: Debian 13 minimal, ohne SSH-Server (Verwaltung und Terminal über Cockpit), Sicherheitsupdates automatisch.
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string signagecast
d-i netcfg/get_domain string
d-i netcfg/hostname string signagecast
d-i hw-detect/load_firmware boolean true
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i passwd/root-login boolean false
d-i passwd/user-fullname string SignageCast
d-i passwd/username string tvadmin
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i apt-setup/non-free-firmware boolean true
# contrib und non-free: Intel-Videotreiber (intel-media-va-driver-non-free) und Schriften für die TV-Seite
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/services-select multiselect security, updates
# keine Quelltext-Paketquellen (deb-src): spart Download bei jedem apt update
d-i apt-setup/enable-source-repositories boolean false
tasksel tasksel/first multiselect
d-i pkgsel/include string curl ca-certificates sudo unattended-upgrades
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default
# Auch unter \EFI\BOOT ablegen: manche Rechner vergessen ihre Boot-Einträge. Empfohlene Pakete bleiben an – sonst fehlt
# der signierte Shim und Secure Boot lehnt den Start ab (gefunden beim Test 2026-11-16).
d-i grub-installer/force-efi-extra-removable boolean true
d-i finish-install/reboot_in_progress note
d-i preseed/late_command string sh /cdrom/signagecast/spaet.sh
