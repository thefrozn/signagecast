<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SignageCast – Durchsage</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --text: #1d1d1f; --leise: #6e6e73; --karte: #fff; --hg: #f2f2f5; --linie: #d8d8dc; --akzent: #0066cc; --gut: #2e7d32; --schlecht: #c62828; }
  @media (prefers-color-scheme: dark) { :root { --text: #f2f2f2; --leise: #a1a1a6; --karte: #1c1c1e; --hg: #000; --linie: #38383a; --akzent: #4da3ff; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font: 17px/1.45 system-ui, sans-serif; background: var(--hg); color: var(--text); }
  main { max-width: 720px; margin: 0 auto; }
  .karte { background: var(--karte); border: 1px solid var(--linie); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  h1 { font-size: 1.25em; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .leise { color: var(--leise); font-size: .9em; }
  input[type=text], input[type=password], select { width: 100%; font: inherit; padding: 12px; border-radius: 10px; border: 1px solid var(--linie);
    background: var(--karte); color: var(--text); }
  button { font: inherit; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--linie); background: var(--karte); color: var(--text); cursor: pointer; }
  button.haupt { background: var(--akzent); border-color: var(--akzent); color: #fff; font-weight: 600; width: 100%; padding: 14px; font-size: 1.1em; }
  button:disabled { opacity: .5; }
  .tvs { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 14px; }
  .tvs label, .optionen label { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border: 1px solid var(--linie); border-radius: 10px; cursor: pointer; }
  .tvs input:checked + span { font-weight: 600; }
  .vorlagen { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 14px; }
  .vorlagen button { font-size: .9em; padding: 6px 10px; }
  .optionen { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .optionen select { width: auto; padding: 8px; }
  #meldung { min-height: 1.4em; margin: 10px 0 0; } .gut { color: var(--gut); } .schlecht { color: var(--schlecht); }
  ul { list-style: none; padding: 0; margin: 0; } li { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--linie); }
  li:last-child { border-bottom: 0; } li .text { flex: 1; min-width: 0; } li.aus { opacity: .55; }
  [hidden] { display: none !important; }
  #notfall { border-color: #c62828; } #notfall h1 { color: #c62828; }
  button.notfall { background: #c62828; border-color: #c62828; color: #fff; font-weight: 600; width: 100%; padding: 14px; font-size: 1.1em; }
  #alarmLaeuft { background: #c62828; color: #fff; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
</style>
</head>
<body>
<main>
  <div class="karte" id="anmeldung" hidden>
    <h1 id="tTitel"></h1>
    <p class="leise" id="tAnmeldenText"></p>
    <input type="password" id="pw" autocomplete="current-password">
    <p><button class="haupt" id="anmelden"></button></p>
    <p id="anmeldeFehler" class="schlecht"></p>
  </div>
  <div id="pult" hidden>
    <div class="karte">
      <h1><span id="tTitel2"></span><button id="abmelden"></button></h1>
      <div class="leise" id="tAn"></div>
      <div class="tvs" id="tvs"></div>
      <input type="text" id="text" maxlength="200" autocomplete="off">
      <div class="vorlagen" id="vorlagen"></div>
      <div class="optionen">
        <label id="vorlesenZeile"><input type="checkbox" id="vorlesen"> <span id="tVorlesen"></span></label>
        <label id="gongZeile"><input type="checkbox" id="gong"> <span id="tGong"></span></label>
        <span class="leise" id="tDauer"></span><select id="dauer"></select>
      </div>
      <button class="haupt" id="senden"></button>
      <p id="meldung" class="leise"></p>
    </div>
    <div class="karte"><h1 id="tZuletzt"></h1><ul id="liste"></ul></div>
    <div class="karte" id="lauf" hidden>
      <h1 id="tLauf"></h1>
      <p class="leise" id="tLaufText"></p>
      <input type="text" id="laufText" maxlength="200" autocomplete="off">
      <div class="optionen"><label><input type="checkbox" id="laufWarnung"> <span id="tWarnung"></span></label>
        <span class="leise" id="tLaufDauer"></span><select id="laufDauer"></select></div>
      <button class="haupt" id="laufSenden"></button>
    </div>
    <div class="karte" id="lay" hidden>
      <h1 id="tLayout"></h1>
      <p class="leise" id="tLayoutText"></p>
      <div class="optionen"><select id="layWahl"></select><span class="leise" id="tLayDauer"></span><select id="layDauer"></select></div>
      <button class="haupt" id="laySetzen"></button>
    </div>
    <div class="karte" id="sch" hidden>
      <h1 id="tSchalten"></h1>
      <ul id="schListe"></ul>
    </div>
    <div class="karte" id="standKarte" hidden><h1 id="tStand"></h1><ul id="standListe"></ul></div>
    <div class="karte" id="notfall" hidden>
      <h1 id="tNotfall"></h1>
      <div id="alarmLaeuft" hidden><b id="alarmText"></b><br><span id="alarmSeit"></span>
        <p><button id="alarmAus"></button></p></div>
      <div id="alarmNeu"><p class="leise" id="tNotfallText"></p>
        <select id="alarmVorlage"></select>
        <p><input type="text" id="alarmEigen" maxlength="200" autocomplete="off"></p>
        <button class="notfall" id="alarmAn"></button></div>
    </div>
  </div>
</main>
<script>
"use strict";
// Durchsage-Pult: nur Meldungen an die erlaubten Fernseher senden und beenden – keine Einstellungen.
// Seit 0.38 je nach Rechten des Zugangs zusätzlich: Laufschrift-Meldung, Layout vorübergehend umschalten, Fernseher ein/aus (HA).
const TX = {
  de: { titel: "Durchsage", anmeldenText: "Bitte mit dem Pult-Passwort anmelden.", anmelden: "Anmelden", abmelden: "Abmelden",
        an: "An:", alle: "alle", platzhalter: "Text der Durchsage, z. B. Frau Bauer, bitte in Behandlungsraum 2",
        vorlesen: "vorlesen", gong: "Gong vorher", dauer: "Anzeige:", senden: "Durchsage senden", gesendet: "Gesendet – erscheint in etwa 10 Sekunden.",
        zuletzt: "Zuletzt", leer: "Noch keine Durchsage.", beenden: "beenden", laeuft: "läuft", keinTv: "Bitte mindestens einen Kanal wählen.",
        keinText: "Bitte einen Text eingeben.", falsch: "Falsches Passwort.", d_stimme_fehlt: "Die Stimme ist noch nicht geladen (Verwaltung → Einstellungen → Durchsage-Pult).", min: (n) => `${n} min`, abgelaufen: "Bitte neu anmelden.",
        notfall: "Notfall-Vollbild", notfallText: "Zeigt den Text rot über den ganzen Bildschirm aller gewählten Kanäle – bis jemand es hier beendet.",
        eigen: "oder eigener Text", ausloesen: "Notfall-Vollbild zeigen", wirklich: "Wirklich das Notfall-Vollbild auf den Fernsehern zeigen?",
        beendenAlarm: "Notfall-Vollbild beenden", seit: (z, v) => `seit ${z} Uhr (${v})`, wirklichAus: "Notfall-Vollbild beenden?",
        lauf: "Laufschrift-Meldung", laufText: "Ein Hinweis, der unten über die gewählten Kanäle läuft, z. B. „Heute ab 16 Uhr geschlossen“.",
        laufPlatz: "Text der Meldung", warnung: "als Warnung (rot)", laufSenden: "Meldung zeigen", std: (n) => n === 1 ? "1 Stunde" : `${n} Stunden`,
        layout: "Layout umschalten", layoutText: "Zeigt auf den gewählten Kanälen vorübergehend ein anderes Layout – danach geht es von selbst zurück.",
        laySetzen: "Layout zeigen", schalten: "Fernseher ein/aus", an: "Ein", aus: "Aus", keinSchalter: "kein Schalter in HA",
        zustand: { an: "an", aus: "aus", weg: "nicht erreichbar", fehler: "Fehler" }, stand: "Gerade eingestellt",
        layoutBis: (n, b) => `Layout „${n}“ bis ${b}`, meldungBis: (t, b) => `Meldung „${t}“ bis ${b}`, zurueck: "zurück", beendenKurz: "beenden",
        gezeigt: "Erledigt – erscheint in etwa 15 Sekunden.", p_recht: "Dieser Zugang darf das nicht.", p_kein_schalten: "Für diesen Kanal ist kein Schalter eingetragen.",
        d_text_tv: "Bitte Text und mindestens einen Kanal wählen." },
  en: { titel: "Announcement", anmeldenText: "Please log in with the panel password.", anmelden: "Log in", abmelden: "Log out",
        an: "To:", alle: "all", platzhalter: "Announcement text, e.g. Mrs Baker, please go to room 2",
        vorlesen: "read aloud", gong: "chime first", dauer: "Show for:", senden: "Send announcement", gesendet: "Sent – appears in about 10 seconds.",
        zuletzt: "Recent", leer: "No announcement yet.", beenden: "end", laeuft: "showing", keinTv: "Please choose at least one channel.",
        keinText: "Please enter a text.", falsch: "Wrong password.", d_stimme_fehlt: "The voice is not loaded yet (Admin → Settings → Announcement panel).", min: (n) => `${n} min`, abgelaufen: "Please log in again.",
        notfall: "Emergency screen", notfallText: "Shows the text in red across the whole screen of the chosen channels – until someone ends it here.",
        eigen: "or own text", ausloesen: "Show emergency screen", wirklich: "Really show the emergency screen on the TVs?",
        beendenAlarm: "End emergency screen", seit: (z, v) => `since ${z} (${v === "Verwaltung" ? "admin" : v})`, wirklichAus: "End the emergency screen?",
        lauf: "Ticker message", laufText: "A note that runs along the bottom of the chosen channels, e.g. “Closed from 4 pm today”.",
        laufPlatz: "Message text", warnung: "as warning (red)", laufSenden: "Show message", std: (n) => n === 1 ? "1 hour" : `${n} hours`,
        layout: "Switch layout", layoutText: "Shows another layout on the chosen channels for a while – then it switches back by itself.",
        laySetzen: "Show layout", schalten: "TVs on/off", an: "On", aus: "Off", keinSchalter: "no switch in HA",
        zustand: { an: "on", aus: "off", weg: "not reachable", fehler: "error" }, stand: "Currently set",
        layoutBis: (n, b) => `Layout “${n}” until ${b}`, meldungBis: (t, b) => `Message “${t}” until ${b}`, zurueck: "switch back", beendenKurz: "end",
        gezeigt: "Done – appears in about 15 seconds.", p_recht: "This account may not do that.", p_kein_schalten: "No switch is set for this channel.",
        d_text_tv: "Please enter a text and choose at least one channel." },
};
let T = TX[(navigator.language || "de").startsWith("de") ? "de" : "en"], INFO = null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function api(pfad, daten) {
  const r = await fetch("/pult/" + pfad, daten === undefined ? { cache: "no-store", credentials: "same-origin" }
    : { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json", "X-Pult": "1" }, body: JSON.stringify(daten) });
  if (r.status === 401) { zeigeAnmeldung(T.abgelaufen); throw new Error("401"); }
  return r.json();
}

function zeigeAnmeldung(hinweis) {
  $("#pult").hidden = true; $("#anmeldung").hidden = false;
  $("#tTitel").textContent = "SignageCast – " + T.titel; $("#tAnmeldenText").textContent = T.anmeldenText;
  $("#anmelden").textContent = T.anmelden; $("#anmeldeFehler").textContent = hinweis || "";
  $("#pw").focus();
}

async function anmelden() {
  const r = await fetch("/pult/anmelden", { method: "POST", credentials: "same-origin",
    headers: { "Content-Type": "application/json", "X-Pult": "1" }, body: JSON.stringify({ passwort: $("#pw").value }) });
  if (!r.ok) { $("#anmeldeFehler").textContent = T.falsch; return; }
  $("#pw").value = ""; start();
}

async function start() {
  try { INFO = await api("info"); } catch (_) { return; }
  if (!INFO.ok) return zeigeAnmeldung();
  T = TX[INFO.sprache] || T;
  $("#anmeldung").hidden = true; $("#pult").hidden = false;
  $("#tTitel2").textContent = `${T.titel} · ${INFO.zugang}`; $("#abmelden").textContent = T.abmelden;
  $("#tAn").textContent = T.an; $("#text").placeholder = T.platzhalter; $("#tVorlesen").textContent = T.vorlesen;
  $("#tGong").textContent = T.gong; $("#tDauer").textContent = T.dauer; $("#senden").textContent = T.senden; $("#tZuletzt").textContent = T.zuletzt;
  const tvs = INFO.fernseher.map((t) => `<label><input type="checkbox" value="${esc(t.id)}" ${INFO.fernseher.length === 1 ? "checked" : ""}><span>${esc(t.name)}</span></label>`);
  if (INFO.fernseher.length > 1) tvs.push(`<label><input type="checkbox" id="alle"><span>${esc(T.alle)}</span></label>`);
  $("#tvs").innerHTML = tvs.join("");
  if ($("#alle")) $("#alle").onchange = (e) => { for (const c of document.querySelectorAll("#tvs input[value]")) c.checked = e.target.checked; };
  $("#vorlagen").innerHTML = INFO.vorlagen.map((v, i) => `<button data-i="${i}">${esc(v)}</button>`).join("");
  for (const b of document.querySelectorAll("#vorlagen button")) b.onclick = () => {
    const t = INFO.vorlagen[b.dataset.i], i = t.indexOf("…"), feld = $("#text");
    feld.value = t; feld.focus();
    if (i >= 0) feld.setSelectionRange(i, i + 1);                // erste Lücke markieren – gleich den Namen tippen
  };
  $("#vorlesenZeile").hidden = !INFO.vorlesen; $("#vorlesen").checked = INFO.vorlesen;
  $("#gongZeile").hidden = !INFO.vorlesen; $("#gong").checked = INFO.gong;
  const dauern = [...new Set([30, 60, 120, 300, 600, INFO.dauer_s])].sort((a, b) => a - b);
  $("#dauer").innerHTML = dauern.map((s) => `<option value="${s}" ${s === INFO.dauer_s ? "selected" : ""}>${s < 60 ? s + " s" : T.min(s / 60)}</option>`).join("");
  $("#notfall").hidden = !INFO.alarm;
  if (INFO.alarm) {
    $("#tNotfall").textContent = "⚠ " + T.notfall; $("#tNotfallText").textContent = T.notfallText;
    $("#alarmVorlage").innerHTML = INFO.alarm_vorlagen.map((v, i) => `<option value="${i}">${esc(v)}</option>`).join("");
    $("#alarmEigen").placeholder = T.eigen; $("#alarmAn").textContent = T.ausloesen; $("#alarmAus").textContent = T.beendenAlarm;
  }
  const R = INFO.rechte || {};
  $("#lauf").hidden = !R.meldung; $("#lay").hidden = !R.layout; $("#sch").hidden = !R.schalten;
  $("#standKarte").hidden = !(R.meldung || R.layout || R.schalten);
  if (R.meldung) {
    $("#tLauf").textContent = T.lauf; $("#tLaufText").textContent = T.laufText; $("#laufText").placeholder = T.laufPlatz;
    $("#tWarnung").textContent = T.warnung; $("#tLaufDauer").textContent = T.dauer; $("#laufSenden").textContent = T.laufSenden;
    $("#laufDauer").innerHTML = [900, 1800, 3600, 7200, 14400, 28800, 43200].map((x) => `<option value="${x}" ${x === 3600 ? "selected" : ""}>${x < 3600 ? T.min(x / 60) : T.std(x / 3600)}</option>`).join("");
  }
  if (R.layout) {
    $("#tLayout").textContent = T.layout; $("#tLayoutText").textContent = T.layoutText; $("#tLayDauer").textContent = T.dauer;
    $("#laySetzen").textContent = T.laySetzen;
    $("#layWahl").innerHTML = INFO.layouts.map((l) => `<option value="${esc(l.id)}">${esc(l.name)}</option>`).join("");
    $("#layDauer").innerHTML = [15, 30, 60, 120, 240, 480, 720].map((x) => `<option value="${x}" ${x === 60 ? "selected" : ""}>${x < 60 ? T.min(x) : T.std(x / 60)}</option>`).join("");
  }
  $("#tSchalten").textContent = T.schalten; $("#tStand").textContent = T.stand;
  liste(); setInterval(liste, 10000);
}

function gewaehlt() { return [...document.querySelectorAll("#tvs input[value]:checked")].map((c) => c.value); }
function melden(r) {
  const m = $("#meldung");
  m.className = r && r.ok ? "gut" : "schlecht";
  m.textContent = r && r.ok ? T.gezeigt : (r && (T[r.code] || r.fehler)) || "?";
  m.scrollIntoView({ block: "nearest" });
}
async function laufSenden() {
  const r = await api("meldung", { text: $("#laufText").value.trim(), fernseher: gewaehlt(), dauer_s: Number($("#laufDauer").value),
                                   stil: $("#laufWarnung").checked ? "warnung" : "info" }).catch(() => null);
  melden(r); if (r && r.ok) { $("#laufText").value = ""; stand(); }
}
async function laySetzen() {
  const r = await api("layout", { layout: $("#layWahl").value, fernseher: gewaehlt(), minuten: Number($("#layDauer").value) }).catch(() => null);
  melden(r); if (r && r.ok) stand();
}
// Was das Pult gerade eingestellt hat (Layout, Meldung) und Zustand der Fernseher aus HA – mit „zurück“/„beenden“
async function stand() {
  const R = (INFO && INFO.rechte) || {};
  if (!(R.meldung || R.layout || R.schalten)) return;
  let d; try { d = await api("stand"); } catch (_) { return; }
  const zeit = (t) => new Date(t * 1000).toLocaleTimeString(INFO.sprache === "en" ? "en-GB" : "de-DE", { hour: "2-digit", minute: "2-digit" });
  const name = (id) => (INFO.fernseher.find((t) => t.id === id) || {}).name || id;
  const zeilen = [];
  for (const f of d.fernseher) {
    if (f.layout && R.layout) zeilen.push(`<li><span class="text">${esc(name(f.id))}<br><span class="leise">${esc(T.layoutBis(f.layout.name, zeit(f.layout.bis)))}</span></span>
      <button data-lay="${esc(f.id)}">${esc(T.zurueck)}</button></li>`);
    if (f.meldung && R.meldung) zeilen.push(`<li><span class="text">${esc(name(f.id))}<br><span class="leise">${esc(T.meldungBis(f.meldung.text, zeit(f.meldung.bis)))}</span></span>
      <button data-lauf="${esc(f.id)}">${esc(T.beendenKurz)}</button></li>`);
  }
  $("#standListe").innerHTML = zeilen.join("") || `<li class="leise">–</li>`;
  for (const b of document.querySelectorAll("[data-lay]")) b.onclick = async () => { await api("layout", { aus: true, fernseher: [b.dataset.lay] }).catch(() => null); stand(); };
  for (const b of document.querySelectorAll("[data-lauf]")) b.onclick = async () => { await api("meldung", { aus: true, fernseher: [b.dataset.lauf] }).catch(() => null); stand(); };
  if (R.schalten) {
    $("#schListe").innerHTML = INFO.fernseher.map((t) => {
      const z = (d.fernseher.find((f) => f.id === t.id) || {}).zustand;
      return `<li><span class="text">${esc(t.name)}${z ? ` <span class="leise">(${esc(T.zustand[z] || z)})</span>` : ""}</span>
        ${t.schalten ? `<button data-an="${esc(t.id)}">${esc(T.an)}</button><button data-aus="${esc(t.id)}">${esc(T.aus)}</button>` : `<span class="leise">${esc(T.keinSchalter)}</span>`}</li>`;
    }).join("");
    for (const b of document.querySelectorAll("[data-an],[data-aus]")) b.onclick = async () => {
      b.disabled = true;
      const r = await api("schalten", { tv: b.dataset.an || b.dataset.aus, an: !!b.dataset.an }).catch(() => null);
      melden(r); b.disabled = false; setTimeout(stand, 9000);
    };
  }
}

// Notfall-Vollbild (seit 0.21): nur für Zugänge mit diesem Recht; Fernseher wie bei der Durchsage (keiner gewählt = alle erlaubten)
async function alarmStand(d) {
  if (!INFO || !INFO.alarm) return;
  if (!d) { try { d = await api("alarm"); } catch (_) { return; } }
  $("#alarmLaeuft").hidden = !d.aktiv; $("#alarmNeu").hidden = !!d.aktiv;
  if (d.aktiv) { $("#alarmText").textContent = d.text; $("#alarmSeit").textContent = T.seit(d.zeit, d.von); }
}
async function alarmAn() {
  const text = $("#alarmEigen").value.trim() || INFO.alarm_vorlagen[Number($("#alarmVorlage").value)] || "";
  if (!text) { $("#meldung").className = "schlecht"; $("#meldung").textContent = T.keinText; return; }
  if (!confirm(T.wirklich + "\n\n" + text)) return;
  const tvs = [...document.querySelectorAll("#tvs input[value]:checked")].map((c) => c.value);
  const r = await api("alarm", { text, fernseher: tvs }).catch(() => null);
  if (r && r.ok === false) { $("#meldung").className = "schlecht"; $("#meldung").textContent = T[r.code] || r.fehler; }
  $("#alarmEigen").value = "";
  alarmStand(r && r.ok ? r : null);
}
async function alarmAus() {
  if (!confirm(T.wirklichAus)) return;
  alarmStand(await api("alarm", { aus: true }).catch(() => null));
}

async function senden() {
  const tvs = [...document.querySelectorAll("#tvs input[value]:checked")].map((c) => c.value);
  const text = $("#text").value.trim(), m = $("#meldung");
  if (!tvs.length) { m.className = "schlecht"; m.textContent = T.keinTv; return; }
  if (!text) { m.className = "schlecht"; m.textContent = T.keinText; return; }
  $("#senden").disabled = true;
  try {
    const r = await api("senden", { text, fernseher: tvs, vorlesen: $("#vorlesen").checked, gong: $("#gong").checked, dauer_s: Number($("#dauer").value) });
    m.className = r.ok ? "gut" : "schlecht"; m.textContent = r.ok ? T.gesendet : (T[r.code] || r.fehler);
    if (r.ok) { $("#text").value = ""; liste(); }
  } catch (_) { /* Anmeldung wird gezeigt */ } finally { $("#senden").disabled = false; }
}

let listeNr = 0;
async function liste() {
  alarmStand();
  if (listeNr++ % 3 === 0) stand();                // Stand nur alle 30 s (und nach jeder Aktion)
  let d; try { d = await api("liste"); } catch (_) { return; }
  $("#liste").innerHTML = d.liste.length ? d.liste.map((x) => `<li class="${x.laeuft ? "" : "aus"}"><span class="leise">${esc(x.zeit)}</span>
    <span class="text">${esc(x.text)}<br><span class="leise">→ ${esc(x.tvs.join(", "))}</span></span>
    ${x.laeuft ? `<button data-id="${esc(x.id)}">${esc(T.beenden)}</button>` : ""}</li>`).join("") : `<li class="leise">${esc(T.leer)}</li>`;
  for (const b of document.querySelectorAll("#liste button")) b.onclick = async () => { await api("beenden", { id: b.dataset.id }); liste(); };
}

$("#anmelden").onclick = anmelden;
$("#pw").onkeydown = (e) => { if (e.key === "Enter") anmelden(); };
$("#senden").onclick = senden;
$("#alarmAn").onclick = alarmAn;
$("#alarmAus").onclick = alarmAus;
$("#laufSenden").onclick = laufSenden;
$("#laySetzen").onclick = laySetzen;
$("#text").onkeydown = (e) => { if (e.key === "Enter") senden(); };
$("#abmelden").onclick = async () => { await api("abmelden", {}).catch(() => {}); zeigeAnmeldung(); };
start();
</script>
