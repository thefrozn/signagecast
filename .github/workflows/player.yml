# Baut bei jedem Release-Tag (v*) das Image für den Raspberry-Pi-Player und hängt es an das Release:
# signagecast-player-v<version>.img.xz und .json (Prüfsumme, Versatz des Platzhalters). Die .json signiert danach
# ./release.sh v<version> --player (Schlüssel nur beim Projekt). Von Hand gestartet: nur als Artefakt (7 Tage).
# Seit 0.36 zusätzlich der PC-Player (x86-64, UEFI): signagecast-pc-v<version>.iso.xz, .json und .cdx.json.
name: Player-Image
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ziel:
        description: "Welche Images (von Hand)"
        type: choice
        options: [beide, pi, pc]
        default: beide
permissions:
  contents: write
jobs:
  image:
    if: github.event_name != 'workflow_dispatch' || inputs.ziel != 'pc'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q parted e2fsprogs xz-utils zerofree
      - name: Image bauen
        run: |
          V=${GITHUB_REF_NAME#v}
          case "$GITHUB_REF" in refs/tags/v*) ;; *) V="$(cat VERSION)-test";; esac
          sudo sh player/bauen.sh out "$V"
          sudo chown -R "$(id -u)" out
      - name: An das Release hängen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 30); do gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break; sleep 20; done
          gh release upload "$GITHUB_REF_NAME" out/* --clobber
      - if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: player-image
          path: out/
          retention-days: 7
  pc:
    if: github.event_name != 'workflow_dispatch' || inputs.ziel != 'pi'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen (Container debian:trixie)
        run: |
          V=${GITHUB_REF_NAME#v}
          case "$GITHUB_REF" in refs/tags/v*) ;; *) V="$(cat VERSION)-test";; esac
          docker run --rm --privileged -v "$PWD:/w" -w /w debian:trixie sh player/pc/bauen.sh out "$V"
          sudo chown -R "$(id -u)" out
      - name: An das Release hängen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 30); do gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break; sleep 20; done
          gh release upload "$GITHUB_REF_NAME" out/* --clobber
      - if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: pc-image
          path: out/
          retention-days: 7
