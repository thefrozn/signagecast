# SignageCast – MediaMTX. Vorlage: den Abschnitt paths (je Fernseher ein Pfad http://<IP>:8888/<id>) setzt der Datendienst aus den
# Einstellungen; MediaMTX lädt Änderungen selbst.
logLevel: info
api: no
metrics: no
pprof: no
playback: no
rtmp: no
srt: no
webrtc: no
moq: no
rtsp: yes
rtspAddress: 127.0.0.1:8554        # nur intern (ffmpeg -> MediaMTX)
rtspTransports: [tcp]
hls: yes
hlsAddress: :8888                  # Abspielseite und Stream: http://<IP>:8888/<id>
hlsVariant: fmp4                   # nötig für H.265 im Browser
hlsSegmentCount: 7
hlsSegmentDuration: 2s
hlsAllowOrigins: ['*']

# Wer darf was: alles nur vom Container selbst (ffmpeg veröffentlicht, Chromium liest Kameras cam_*);
# von außen nur die Fernseher-Pfade lesen – Kameras (cam_<id>) bleiben im Container
authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: ['127.0.0.1', '::1']
    permissions:
      - action: publish
      - action: read
      - action: playback
  - user: any
    pass:
    ips: []
    permissions:
      - action: read
        path: ~^[a-z][a-z0-9]{0,11}$

paths:
{PFADE}
